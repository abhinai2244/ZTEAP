# ============================================================
# ZTAP - Kubernetes Services
# ============================================================

# Internal Database Service (ClusterIP Only - Never Exposed)
apiVersion: v1
kind: Service
metadata:
  name: ztap-postgres-service
  namespace: ztap-system
  labels:
    app: ztap-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: ztap-postgres

---
# ZTAP Application Service (NodePort for Minikube Access)
apiVersion: v1
kind: Service
metadata:
  name: ztap-portal-service
  namespace: ztap-system
  labels:
    app: ztap-portal
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
      protocol: TCP
  selector:
    app: ztap-portal
